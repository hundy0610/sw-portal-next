name: Send Feedback Emails (Cron)

on:
  # 2026-07-28: 만족도 메일 발송이 맥북 폴러로 이전 — 자동 실행 중단
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  send-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-feedback cron endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://swportal.vercel.app/api/cron/send-feedback)
          echo "HTTP Status: $response"
          cat /tmp/response.json
          if [ "$response" != "200" ]; then
            echo "Error: Non-200 response"
            exit 1
          fi
